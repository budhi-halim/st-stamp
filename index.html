<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f8f6">
  <meta name="description" content="Sweet Times stamp designs and downloads.">
  <title>Sweet Times — Stamps</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <main>
    <header class="page-header">
      <h1>Sweet Times <span>Stamps</span></h1>
      <button type="button" class="reset-button" id="reset" aria-label="Reset stamp settings">Reset</button>
    </header>

    <details class="settings-panel" id="export-settings">
    <summary><span>Export settings</span><span id="settings-summary">45 mm · Black · 600 DPI</span></summary>
    <form class="settings" id="settings" aria-label="Stamp settings">
      <div class="field">
        <label for="width">Width</label>
        <div class="number-field"><input id="width" name="width" type="number" inputmode="decimal" min="20" max="100" step="0.5" value="45" required aria-describedby="width-note"><span aria-hidden="true">mm</span></div>
      </div>
      <div class="field">
        <label for="ink">Ink</label>
        <div class="select-field ink-field"><i id="ink-sample" aria-hidden="true"></i><select id="ink" name="ink"><option value="#171717">Black</option><option value="#193f69">Blue</option><option value="#9b3037">Red</option></select></div>
      </div>
      <div class="field">
        <label for="dpi">PNG / JPG resolution</label>
        <div class="select-field"><select id="dpi" name="dpi"><option value="300">300 DPI</option><option value="600" selected>600 DPI</option><option value="1200">1200 DPI</option></select></div>
      </div>
      <div class="field">
        <label for="border">Border thickness</label>
        <div class="select-field"><select id="border" name="border"><option value="0.25">0.25 mm</option><option value="0.35" selected>0.35 mm</option><option value="0.5">0.50 mm</option></select></div>
      </div>
      <div class="settings-bottom">
        <p id="width-note">Dimensions include a 1.5 mm margin.</p>
        <label class="preview-toggle"><input type="checkbox" id="checkerboard"><span class="toggle-track" aria-hidden="true"></span><span>Transparent preview</span></label>
      </div>
    </form>
    </details>

    <p class="page-error" id="page-error" role="alert" hidden></p>
    <div class="gallery" id="gallery" aria-label="Stamp designs" aria-busy="true">
      <p class="loading">Loading designs…</p>
    </div>
    <footer><span>Playlist Script · Outfit Semibold</span><span>SVG and PDF use outlined lettering.</span></footer>
  </main>
  <p class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></p>
  <noscript><p class="noscript">Enable JavaScript to preview and download the stamps.</p></noscript>
</body>
</html>
